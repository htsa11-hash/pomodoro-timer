name: Deploy Cabo Game to GitHub Pages

on:
  push:
    branches: [master, claude/cabo-card-game-app-eeyBP]
    paths:
      - 'cabo-game/**'
      - '.github/workflows/deploy-cabo.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cabo-game/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: cabo-game

      - name: Build
        run: npm run build
        working-directory: cabo-game
        # Firebase web config is public by design (it ships in the JS bundle);
        # access control is enforced by Firestore security rules.
        env:
          VITE_FIREBASE_API_KEY: AIzaSyCYXiiPbrvPkr2uaOMuP3AcgjqR5N4HONA
          VITE_FIREBASE_AUTH_DOMAIN: jumannjiii.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: jumannjiii
          VITE_FIREBASE_STORAGE_BUCKET: jumannjiii.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: "337013613660"
          VITE_FIREBASE_APP_ID: 1:337013613660:web:65f23b1f868d6ee6fdb299

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: cabo-game/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
