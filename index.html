<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ポモドーロ・タイマー</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <h1>🍅 ポモドーロ・タイマー</h1>

    <div class="mode-buttons">
      <button class="mode-btn active" data-mode="work">作業 (25分)</button>
      <button class="mode-btn" data-mode="short">小休憩 (5分)</button>
      <button class="mode-btn" data-mode="long">長休憩 (15分)</button>
    </div>

    <div class="timer-display" id="timerDisplay">25:00</div>

    <div class="controls">
      <button id="startBtn">開始</button>
      <button id="pauseBtn" disabled>一時停止</button>
      <button id="resetBtn">リセット</button>
    </div>

    <div class="task-section">
      <h2>タスク</h2>
      <form id="taskForm">
        <input type="text" id="taskInput" placeholder="タスクを入力..." required>
        <button type="submit">追加</button>
      </form>
      <ul id="taskList"></ul>
      <p class="completed-count">完了したポモドーロ数: <span id="pomodoroCount">0</span></p>
    </div>
  </div>

  <audio id="alarmSound" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg" preload="auto"></audio>

  <script src="script.js"></script>
</body>
</html>
